<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Labirinto Sombrio</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050509;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

h1 {
    color: #d8b4ff;
    text-shadow: 0 0 15px #7c3aed;
    margin-bottom: 5px;
}

#info {
    margin: 10px;
    font-size: 17px;
}

#game {
    position: relative;

    width: 800px;
    max-width: 95vw;

    aspect-ratio: 20 / 12;

    margin: auto;

    background: #101015;

    border: 4px solid #39394d;

    overflow: hidden;

    box-shadow:
        0 0 30px #000;
}


/* ===================================
   PAREDES
=================================== */

.wall {

    position: absolute;

    width: 5%;
    height: 8.333%;

    background:
        linear-gradient(
            135deg,
            #353545,
            #171720
        );

    border: 1px solid #48485c;

}


/* ===================================
   PERSONAGEM
=================================== */

#player {

    position: absolute;

    width: 5%;
    height: 8.333%;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 28px;

    z-index: 10;

    transition:
        left .08s,
        top .08s;

    filter:
        drop-shadow(
            0 0 8px #00eaff
        );
}


/* ===================================
   CHAVE
=================================== */

#key {

    position: absolute;

    width: 5%;
    height: 8.333%;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 27px;

    z-index: 4;

    animation: keyGlow 1s infinite;

}


@keyframes keyGlow {

    0%,100% {
        filter:
            drop-shadow(
                0 0 5px gold
            );
    }

    50% {
        filter:
            drop-shadow(
                0 0 20px gold
            );
    }

}


/* ===================================
   PORTA
=================================== */

#door {

    position: absolute;

    width: 5%;
    height: 8.333%;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 28px;

    z-index: 4;

}


/* ===================================
   MONSTROS
=================================== */

.monster {

    position: absolute;

    width: 5%;
    height: 8.333%;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 28px;

    z-index: 6;

}


.hunter {

    filter:
        drop-shadow(
            0 0 12px red
        );

}


.trap {

    filter:
        drop-shadow(
            0 0 10px purple
        );

}


/* ===================================
   VISÃO DO MONSTRO
=================================== */

#danger {

    position: absolute;

    top: 8px;
    left: 10px;

    background: rgba(120,0,0,.7);

    padding: 7px 12px;

    border-radius: 8px;

    font-weight: bold;

    display: none;

    z-index: 50;

    animation: dangerBlink .5s infinite;

}


@keyframes dangerBlink {

    50% {
        opacity: .4;
    }

}


/* ===================================
   LANterna
=================================== */

#darkness {

    position: absolute;

    inset: 0;

    z-index: 20;

    pointer-events: none;

    /*
       A posição do buraco da lanterna
       é alterada pelo JavaScript.
    */

    background:
        radial-gradient(
            circle 110px at 50% 50%,
            transparent 0px,
            rgba(0,0,0,.15) 45px,
            rgba(0,0,0,.65) 90px,
            rgba(0,0,0,.94) 150px,
            #000 220px
        );

}


/* ===================================
   MENSAGEM
=================================== */

#message {

    min-height: 28px;

    margin: 12px;

    font-size: 18px;

    color: #cfcfcf;

}


/* ===================================
   BOTÕES
=================================== */

button {

    padding: 11px 18px;

    margin: 4px;

    border: none;

    border-radius: 8px;

    background: #6038c9;

    color: white;

    font-size: 17px;

    cursor: pointer;

}

button:hover {

    background: #8058ed;

}


.controls {

    margin-top: 5px;

}


.controls button {

    width: 58px;
    height: 48px;

}


@media(max-width:600px) {

    h1 {
        font-size: 22px;
    }

    #info {
        font-size: 14px;
    }

}

</style>

</head>


<body>


<h1>🌑 LABIRINTO SOMBRIO</h1>


<div id="info">

🔑 Chave:
<span id="keyStatus">NÃO</span>

&nbsp;&nbsp;

❤️ Vidas:
<span id="lives">3</span>

&nbsp;&nbsp;

👁️:
<span id="hunterStatus">PROCURANDO</span>

</div>


<div id="game">

    <div id="danger">
        ⚠️ O MONSTRO ESTÁ TE VENDO!
    </div>

    <div id="darkness"></div>

</div>


<div id="message">
    Encontre a chave...
</div>


<button onclick="restartGame()">
    🔄 Reiniciar
</button>


<div class="controls">

    <div>
        <button onclick="move(0,-1)">⬆️</button>
    </div>

    <div>
        <button onclick="move(-1,0)">⬅️</button>

        <button onclick="move(0,1)">⬇️</button>

        <button onclick="move(1,0)">➡️</button>
    </div>

</div>


<script>


// ==========================================
// CONFIGURAÇÃO
// ==========================================

const COLS = 20;
const ROWS = 12;


// ==========================================
// MAPA
// ==========================================

const map = [

"11111111111111111111",

"10000000000000000001",

"10111101111101111101",

"10000101000101000001",

"11110101010101111101",

"10000100010000000001",

"10111111011111110101",

"10000001000000010101",

"10111101111111010101",

"10000000000001000001",

"10000000000000000001",

"11111111111111111111"

];


// ==========================================
// VARIÁVEIS
// ==========================================

let player;

let monsters;

let key;

let door;

let hasKey = false;

let lives = 3;

let playing = true;

let hunting = false;


const game =
    document.getElementById("game");

const darkness =
    document.getElementById("darkness");


// ==========================================
// CRIAR MAPA
// ==========================================

function createMap() {

    /*
       Remove somente as paredes
       antigas.
    */

    document
        .querySelectorAll(".wall")
        .forEach(w => w.remove());


    for(let y = 0; y < ROWS; y++) {

        for(let x = 0; x < COLS; x++) {

            if(map[y][x] === "1") {

                const wall =
                    document.createElement("div");

                wall.className = "wall";

                wall.style.left =
                    (x * 5) + "%";

                wall.style.top =
                    (y * 8.333) + "%";

                game.appendChild(wall);

            }

        }

    }

}


// ==========================================
// CRIAR OBJETO
// ==========================================

function createObject(
    id,
    emoji,
    x,
    y,
    className = ""
) {

    const element =
        document.createElement("div");

    element.id = id;

    element.textContent = emoji;

    element.className = className;

    game.appendChild(element);


    const object = {

        element: element,

        x: x,

        y: y

    };


    updatePosition(object);


    return object;

}


// ==========================================
// POSIÇÃO
// ==========================================

function updatePosition(object) {

    object.element.style.left =
        (object.x * 5) + "%";

    object.element.style.top =
        (object.y * 8.333) + "%";

}


// ==========================================
// PAREDE
// ==========================================

function isWall(x,y) {

    if(
        x < 0 ||
        x >= COLS ||
        y < 0 ||
        y >= ROWS
    ) {

        return true;

    }

    return map[y][x] === "1";

}


// ==========================================
// MOVIMENTO DO JOGADOR
// ==========================================

function move(dx,dy) {

    if(!playing) return;


    const nx =
        player.x + dx;

    const ny =
        player.y + dy;


    if(isWall(nx,ny)) {

        return;

    }


    player.x = nx;

    player.y = ny;


    updatePosition(player);


    checkObjects();


    updateFlashlight();

}


// ==========================================
// TECLADO
// ==========================================

document.addEventListener(
    "keydown",
    function(event) {

        const k =
            event.key.toLowerCase();


        if(
            k === "arrowup" ||
            k === "w"
        ) {

            event.preventDefault();

            move(0,-1);

        }


        else if(
            k === "arrowdown" ||
            k === "s"
        ) {

            event.preventDefault();

            move(0,1);

        }


        else if(
            k === "arrowleft" ||
            k === "a"
        ) {

            event.preventDefault();

            move(-1,0);

        }


        else if(
            k === "arrowright" ||
            k === "d"
        ) {

            event.preventDefault();

            move(1,0);

        }


        else if(k === "r") {

            restartGame();

        }

    }
);


// ==========================================
// DISTÂNCIA
// ==========================================

function distance(a,b) {

    return Math.abs(a.x-b.x)
        +
        Math.abs(a.y-b.y);

}


// ==========================================
// CAMINHO LIVRE ENTRE MONSTRO E JOGADOR
// ==========================================

function canSeePlayer(monster) {

    /*
       O monstro só enxerga se estiver
       na mesma linha ou coluna.

       E não pode existir parede entre eles.
    */


    if(
        monster.x !== player.x &&
        monster.y !== player.y
    ) {

        return false;

    }


    // Horizontal

    if(monster.y === player.y) {

        const start =
            Math.min(
                monster.x,
                player.x
            );

        const end =
            Math.max(
                monster.x,
                player.x
            );


        for(
            let x = start + 1;
            x < end;
            x++
        ) {

            if(
                map[monster.y][x] === "1"
            ) {

                return false;

            }

        }

        return true;

    }


    // Vertical

    if(monster.x === player.x) {

        const start =
            Math.min(
                monster.y,
                player.y
            );

        const end =
            Math.max(
                monster.y,
                player.y
            );


        for(
            let y = start + 1;
            y < end;
            y++
        ) {

            if(
                map[y][monster.x] === "1"
            ) {

                return false;

            }

        }

        return true;

    }


    return false;

}


// ==========================================
// MOVIMENTO DO MONSTRO
// ==========================================

function moveHunter() {

    const hunter =
        monsters[0];


    const seesPlayer =
        canSeePlayer(hunter);


    const dist =
        distance(
            hunter,
            player
        );


    /*
       Se o monstro estiver vendo
       o jogador, começa a perseguição.
    */

    if(
        seesPlayer &&
        dist <= 10
    ) {

        hunting = true;

    }


    /*
       Se estiver muito longe,
       para de perseguir.
    */

    if(dist > 12) {

        hunting = false;

    }


    let moves = [

        {dx:1,dy:0},

        {dx:-1,dy:0},

        {dx:0,dy:1},

        {dx:0,dy:-1}

    ];


    if(hunting) {

        /*
           Ordena os movimentos para
           tentar chegar perto do jogador.
        */

        moves.sort(
            function(a,b) {

                const da =
                    Math.abs(
                        player.x -
                        (hunter.x+a.dx)
                    )
                    +
                    Math.abs(
                        player.y -
                        (hunter.y+a.dy)
                    );


                const db =
                    Math.abs(
                        player.x -
                        (hunter.x+b.dx)
                    )
                    +
                    Math.abs(
                        player.y -
                        (hunter.y+b.dy)
                    );


                return da-db;

            }
        );

    }
    else {

        /*
           Se não estiver perseguindo,
           anda aleatoriamente.
        */

        moves.sort(
            () =>
                Math.random() - .5
        );

    }


    for(let m of moves) {

        const nx =
            hunter.x + m.dx;

        const ny =
            hunter.y + m.dy;


        if(!isWall(nx,ny)) {

            hunter.x = nx;

            hunter.y = ny;

            updatePosition(hunter);

            break;

        }

    }


    // Colisão

    if(
        hunter.x === player.x &&
        hunter.y === player.y
    ) {

        loseLife();

    }


    updateHunterStatus();

}


// ==========================================
// ARMADILHAS
// ==========================================

function checkTraps() {

    for(
        let i = 1;
        i < monsters.length;
        i++
    ) {

        const trap =
            monsters[i];


        if(
            trap.x === player.x &&
            trap.y === player.y
        ) {

            loseLife();


            if(playing) {

                document.getElementById(
                    "message"
                ).textContent =
                    "💀 Você caiu em uma armadilha!";

            }

        }

    }

}


// ==========================================
// CHAVE / PORTA
// ==========================================

function checkObjects() {

    checkTraps();


    // Chave

    if(
        player.x === key.x &&
        player.y === key.y
    ) {

        hasKey = true;

        key.element.remove();


        document.getElementById(
            "keyStatus"
        ).textContent =
            "SIM 🔑";


        document.getElementById(
            "message"
        ).textContent =
            "🔑 Você encontrou a chave! Agora fuja!";

    }


    // Porta

    if(
        player.x === door.x &&
        player.y === door.y
    ) {

        if(hasKey) {

            playing = false;


            document.getElementById(
                "message"
            ).textContent =
                "🎉 VOCÊ ESCAPOU! 🎉";


        }

        else {

            document.getElementById(
                "message"
            ).textContent =
                "🔒 Você precisa da chave!";

        }

    }

}


// ==========================================
// PERDER VIDA
// ==========================================

function loseLife() {

    if(!playing) return;


    lives--;


    document.getElementById(
        "lives"
    ).textContent =
        lives;


    if(lives <= 0) {

        playing = false;


        document.getElementById(
            "message"
        ).textContent =
            "💀 GAME OVER!";


        return;

    }


    document.getElementById(
        "message"
    ).textContent =
        "😱 Você foi encontrado!";


    /*
       Volta para o começo.
    */

    player.x = 1;

    player.y = 1;


    updatePosition(player);

}


// ==========================================
// STATUS DO MONSTRO
// ==========================================

function updateHunterStatus() {

    const status =
        document.getElementById(
            "hunterStatus"
        );


    const danger =
        document.getElementById(
            "danger"
        );


    if(hunting) {

        status.textContent =
            "🚨 PERSEGUINDO!";

        status.style.color =
            "red";

        danger.style.display =
            "block";

    }

    else {

        status.textContent =
            "PROCURANDO";

        status.style.color =
            "white";

        danger.style.display =
            "none";

    }

}


// ==========================================
// LANterna
// ==========================================

function updateFlashlight() {

    /*
       Converte a posição do jogador
       para porcentagem dentro da tela.
    */

    const px =
        (
            player.x * 5
        ) + 2.5;


    const py =
        (
            player.y * 8.333
        ) + 4.16;


    darkness.style.background =

        `radial-gradient(
            circle 115px at ${px}% ${py}%,
            transparent 0px,
            rgba(0,0,0,.10) 45px,
            rgba(0,0,0,.55) 90px,
            rgba(0,0,0,.88) 145px,
            #000 220px
        )`;

}


// ==========================================
// REINICIAR
// ==========================================

function restartGame() {

    /*
       Remove objetos antigos.
    */

    document
        .querySelectorAll(
            "#player,#key,#door,.monster"
        )
        .forEach(
            e => e.remove()
        );


    hasKey = false;

    lives = 3;

    playing = true;

    hunting = false;


    document.getElementById(
        "keyStatus"
    ).textContent =
        "NÃO";


    document.getElementById(
        "lives"
    ).textContent =
        "3";


    document.getElementById(
        "message"
    ).textContent =
        "Encontre a 🔑 chave...";


    createMap();


    // Jogador

    player =
        createObject(
            "player",
            "🧙",
            1,
            1
        );


    // Chave

    key =
        createObject(
            "key",
            "🔑",
            17,
            10
        );


    // Porta

    door =
        createObject(
            "door",
            "🚪",
            18,
            1
        );


    // ==================================
    // MONSTRO PERSEGUIDOR
    // ==================================

    const hunter =
        createObject(
            "hunter",
            "👹",
            10,
            5,
            "monster hunter"
        );


    // ==================================
    // ARMADILHA 1
    // ==================================

    const trap1 =
        createObject(
            "trap1",
            "👺",
            7,
            9,
            "monster trap"
        );


    // ==================================
    // ARMADILHA 2
    // ==================================

    const trap2 =
        createObject(
            "trap2",
            "👿",
            14,
            10,
            "monster trap"
        );


    monsters = [

        hunter,

        trap1,

        trap2

    ];


    updateFlashlight();

    updateHunterStatus();

}


// ==========================================
// IA DO MONSTRO
// ==========================================

setInterval(
    moveHunter,
    650
);


// ==========================================
// COMEÇAR
// ==========================================

restartGame();

</script>

</body>
</html>
