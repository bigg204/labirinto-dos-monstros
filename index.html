<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Labirinto Sombrio</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #211538, #050508 65%);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #d8b4ff;
    text-shadow: 0 0 15px #7c3aed;
    margin: 15px 0 5px;
}

#screen {
    width: 100%;
}

#menu {
    max-width: 800px;
    margin: 30px auto;
    padding: 25px;
}

#menu h2 {
    color: #ffcc00;
}

.levels {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-top: 25px;
}

.level-button {
    min-height: 100px;
    border: 2px solid #555;
    border-radius: 12px;
    background: #161622;
    color: white;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: .2s;
}

.level-button:hover:not(:disabled) {
    transform: scale(1.05);
    border-color: #9b6cff;
    background: #29203f;
}

.level-button.unlocked {
    border-color: #7c3aed;
}

.level-button.completed {
    border-color: #00ff88;
    color: #00ff88;
}

.level-button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.level-number {
    display: block;
    font-size: 25px;
    margin-bottom: 8px;
}

#gameScreen {
    display: none;
}

#info {
    max-width: 800px;
    margin: 10px auto;
    padding: 10px;
    background: rgba(15,15,25,.8);
    border-radius: 10px;
    font-size: 16px;
}

#info span {
    margin: 0 5px;
}

#game {
    position: relative;
    width: 800px;
    max-width: 95vw;
    aspect-ratio: 20 / 12;
    margin: auto;
    background: #101015;
    border: 4px solid #39394d;
    overflow: hidden;
    box-shadow: 0 0 30px #000;
}

.wall {
    position: absolute;
    width: 5%;
    height: 8.333%;
    background: linear-gradient(135deg,#353545,#171720);
    border: 1px solid #48485c;
}

#player,
#key,
#door,
.monster {
    position: absolute;
    width: 5%;
    height: 8.333%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#player {
    z-index: 10;
    font-size: 28px;
    filter: drop-shadow(0 0 8px #00eaff);
}

#key {
    z-index: 5;
    font-size: 27px;
    animation: keyGlow 1s infinite;
}

#door {
    z-index: 5;
    font-size: 28px;
}

.monster {
    z-index: 7;
    font-size: 28px;
}

.hunter {
    filter: drop-shadow(0 0 12px red);
}

.trap {
    filter: drop-shadow(0 0 10px purple);
}

#darkness {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
}

#danger {
    position: absolute;
    top: 8px;
    left: 10px;
    z-index: 30;
    background: rgba(130,0,0,.8);
    padding: 7px 12px;
    border-radius: 8px;
    font-weight: bold;
    display: none;
    animation: dangerBlink .5s infinite;
}

@keyframes dangerBlink {
    50% { opacity: .4; }
}

@keyframes keyGlow {
    0%,100% {
        filter: drop-shadow(0 0 5px gold);
    }

    50% {
        filter: drop-shadow(0 0 20px gold);
    }
}

#message {
    min-height: 28px;
    margin: 12px;
    font-size: 18px;
    font-weight: bold;
}

button {
    padding: 11px 18px;
    margin: 4px;
    border: none;
    border-radius: 8px;
    background: #6038c9;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #8058ed;
}

#backButton {
    background: #444;
}

.controls {
    margin-top: 5px;
}

.controls button {
    width: 58px;
    height: 48px;
}

#timer {
    color: #ff5555;
    font-weight: bold;
}

#victory {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.9);
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

#victory h2 {
    color: #00ff88;
    font-size: 35px;
}

#victory p {
    font-size: 19px;
}

@media(max-width:600px) {

    h1 {
        font-size: 22px;
    }

    .levels {
        grid-template-columns: repeat(2,1fr);
    }

    #info {
        font-size: 13px;
    }

}

</style>
</head>


<body>

<div id="screen">

    <div id="menu">

        <h1>🌑 LABIRINTO SOMBRIO</h1>

        <h2>Escolha uma fase</h2>

        <p>
            🔑 Encontre as chaves, fuja do 👹 perseguidor
            e chegue até a 🚪 saída.
        </p>

        <div class="levels" id="levels"></div>

        <button onclick="resetProgress()">
            🗑️ Apagar progresso
        </button>

    </div>


    <div id="gameScreen">

        <h1 id="levelTitle">
            FASE 1
        </h1>

        <div id="info">

            🔑 Chaves:
            <span id="keyStatus">0/1</span>

            ❤️ Vidas:
            <span id="lives">3</span>

            👹:
            <span id="hunterStatus">PROCURANDO</span>

            ⏱️:
            <span id="timer">∞</span>

        </div>


        <div id="game">

            <div id="danger">
                ⚠️ ELE ESTÁ TE VENDO!
            </div>

            <div id="darkness"></div>

            <div id="victory">

                <h2>🎉 FASE CONCLUÍDA!</h2>

                <p id="victoryText">
                    Você conseguiu escapar!
                </p>

                <button onclick="nextLevel()">
                    ▶ Próxima fase
                </button>

                <button onclick="showMenu()">
                    🏠 Menu
                </button>

            </div>

        </div>


        <div id="message">
            Encontre a chave...
        </div>


        <button onclick="restartLevel()">
            🔄 Reiniciar fase
        </button>

        <button id="backButton" onclick="showMenu()">
            🏠 Fases
        </button>


        <div class="controls">

            <div>
                <button onclick="move(0,-1)">⬆️</button>
            </div>

            <div>
                <button onclick="move(-1,0)">⬅️</button>
                <button onclick="move(0,1)">⬇️</button>
                <button onclick="move(1,0)">➡️</button>
            </div>

        </div>

    </div>

</div>


<script>


// ==================================================
// FASES
// ==================================================

const levels = [

    {
        name: "O Começo",
        hunterSpeed: 900,
        vision: 10,
        flashlight: 125,
        traps: 2,
        keys: 1,
        time: 0
    },

    {
        name: "Escuridão",
        hunterSpeed: 750,
        vision: 11,
        flashlight: 105,
        traps: 3,
        keys: 1,
        time: 0
    },

    {
        name: "A Caçada",
        hunterSpeed: 600,
        vision: 12,
        flashlight: 90,
        traps: 4,
        keys: 1,
        time: 0
    },

    {
        name: "Pesadelo",
        hunterSpeed: 500,
        vision: 13,
        flashlight: 75,
        traps: 5,
        keys: 2,
        time: 120
    },

    {
        name: "A Fuga",
        hunterSpeed: 350,
        vision: 15,
        flashlight: 60,
        traps: 6,
        keys: 2,
        time: 90
    }

];


// ==================================================
// MAPA
// ==================================================

const map = [

"11111111111111111111",

"10000000000000000001",

"10111101111101111101",

"10000101000101000001",

"11110101010101111101",

"10000100010000000001",

"10111111011111110101",

"10000001000000010101",

"10111101111111010101",

"10000000000001000001",

"10000000000000000001",

"11111111111111111111"

];

const COLS = 20;
const ROWS = 12;


// ==================================================
// VARIÁVEIS
// ==================================================

let currentLevel = 0;

let player;

let hunter;

let traps = [];

let keys = [];

let door;

let playing = false;

let lives = 3;

let keysCollected = 0;

let timerValue = 0;

let timerInterval;

let hunterInterval;


// ==================================================
// ELEMENTOS
// ==================================================

const game =
    document.getElementById("game");

const darkness =
    document.getElementById("darkness");


// ==================================================
// PROGRESSO
// ==================================================

function getProgress() {

    return parseInt(
        localStorage.getItem(
            "labyrinthProgress"
        ) || "1"
    );

}


function setProgress(value) {

    localStorage.setItem(
        "labyrinthProgress",
        value
    );

}


// ==================================================
// MENU
// ==================================================

function createLevelMenu() {

    const container =
        document.getElementById("levels");

    container.innerHTML = "";

    const unlocked =
        getProgress();


    levels.forEach(function(level,index) {

        const button =
            document.createElement("button");

        button.className =
            "level-button";

        if(index < unlocked) {

            button.classList.add(
                "unlocked"
            );

            if(index < unlocked - 1) {

                button.classList.add(
                    "completed"
                );

            }

            button.disabled = false;

            button.onclick =
                function() {

                    startLevel(index);

                };

        }
        else {

            button.disabled = true;

        }


        let icon =
            index < unlocked
            ? "▶️"
            : "🔒";


        button.innerHTML = `

            <span class="level-number">
                ${icon} ${index + 1}
            </span>

            ${level.name}

        `;


        container.appendChild(button);

    });

}


function showMenu() {

    clearIntervals();

    playing = false;

    document.getElementById(
        "gameScreen"
    ).style.display = "none";

    document.getElementById(
        "menu"
    ).style.display = "block";

    createLevelMenu();

}


// ==================================================
// INICIAR FASE
// ==================================================

function startLevel(index) {

    currentLevel = index;

    document.getElementById(
        "menu"
    ).style.display = "none";

    document.getElementById(
        "gameScreen"
    ).style.display = "block";

    restartLevel();

}


// ==================================================
// CRIAR MAPA
// ==================================================

function createMap() {

    document
        .querySelectorAll(".wall")
        .forEach(
            wall => wall.remove()
        );


    for(let y = 0; y < ROWS; y++) {

        for(let x = 0; x < COLS; x++) {

            if(map[y][x] === "1") {

                const wall =
                    document.createElement("div");

                wall.className =
                    "wall";

                wall.style.left =
                    (x * 5) + "%";

                wall.style.top =
                    (y * 8.333) + "%";

                game.appendChild(wall);

            }

        }

    }

}


// ==================================================
// CRIAR OBJETO
// ==================================================

function createObject(
    id,
    emoji,
    x,
    y,
    className = ""
) {

    const element =
        document.createElement("div");

    element.id = id;

    element.textContent = emoji;

    element.className =
        className;

    game.appendChild(element);


    const object = {

        element,
        x,
        y

    };


    updatePosition(object);

    return object;

}


// ==================================================
// POSIÇÃO
// ==================================================

function updatePosition(object) {

    object.element.style.left =
        (object.x * 5) + "%";

    object.element.style.top =
        (object.y * 8.333) + "%";

}


// ==================================================
// PAREDE
// ==================================================

function isWall(x,y) {

    if(
        x < 0 ||
        x >= COLS ||
        y < 0 ||
        y >= ROWS
    ) {

        return true;

    }

    return map[y][x] === "1";

}


// ==================================================
// MOVIMENTO
// ==================================================

function move(dx,dy) {

    if(!playing) return;


    const nx =
        player.x + dx;

    const ny =
        player.y + dy;


    if(isWall(nx,ny)) {

        return;

    }


    player.x = nx;

    player.y = ny;


    updatePosition(player);

    checkInteractions();

    updateFlashlight();

}


// ==================================================
// TECLADO
// ==================================================

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();


        if(
            key === "arrowup" ||
            key === "w"
        ) {

            event.preventDefault();

            move(0,-1);

        }

        else if(
            key === "arrowdown" ||
            key === "s"
        ) {

            event.preventDefault();

            move(0,1);

        }

        else if(
            key === "arrowleft" ||
            key === "a"
        ) {

            event.preventDefault();

            move(-1,0);

        }

        else if(
            key === "arrowright" ||
            key === "d"
        ) {

            event.preventDefault();

            move(1,0);

        }

        else if(key === "r") {

            restartLevel();

        }

    }
);


// ==================================================
// DISTÂNCIA
// ==================================================

function distance(a,b) {

    return Math.abs(
        a.x - b.x
    )
    +
    Math.abs(
        a.y - b.y
    );

}


// ==================================================
// VISÃO DO MONSTRO
// ==================================================

function canSeePlayer() {

    const dist =
        distance(
            hunter,
            player
        );


    const settings =
        levels[currentLevel];


    if(
        dist > settings.vision
    ) {

        return false;

    }


    /*
       Se estiver na mesma linha
       ou coluna, verifica paredes.
    */

    if(
        hunter.x !== player.x &&
        hunter.y !== player.y
    ) {

        return false;

    }


    if(
        hunter.x === player.x
    ) {

        const start =
            Math.min(
                hunter.y,
                player.y
            );

        const end =
            Math.max(
                hunter.y,
                player.y
            );


        for(
            let y = start + 1;
            y < end;
            y++
        ) {

            if(
                map[y][hunter.x] === "1"
            ) {

                return false;

            }

        }

        return true;

    }


    if(
        hunter.y === player.y
    ) {

        const start =
            Math.min(
                hunter.x,
                player.x
            );

        const end =
            Math.max(
                hunter.x,
                player.x
            );


        for(
            let x = start + 1;
            x < end;
            x++
        ) {

            if(
                map[hunter.y][x] === "1"
            ) {

                return false;

            }

        }

        return true;

    }


    return false;

}


// ==================================================
// MONSTRO
// ==================================================

let hunting = false;


function moveHunter() {

    if(!playing) return;


    const settings =
        levels[currentLevel];


    const sees =
        canSeePlayer();


    const dist =
        distance(
            hunter,
            player
        );


    if(sees) {

        hunting = true;

    }


    if(dist > settings.vision + 3) {

        hunting = false;

    }


    let moves = [

        {dx:1,dy:0},

        {dx:-1,dy:0},

        {dx:0,dy:1},

        {dx:0,dy:-1}

    ];


    if(hunting) {

        moves.sort(
            function(a,b) {

                const da =
                    Math.abs(
                        player.x -
                        (hunter.x+a.dx)
                    )
                    +
                    Math.abs(
                        player.y -
                        (hunter.y+a.dy)
                    );


                const db =
                    Math.abs(
                        player.x -
                        (hunter.x+b.dx)
                    )
                    +
                    Math.abs(
                        player.y -
                        (hunter.y+b.dy)
                    );


                return da - db;

            }
        );

    }
    else {

        moves.sort(
            () =>
                Math.random() - .5
        );

    }


    for(const m of moves) {

        const nx =
            hunter.x + m.dx;

        const ny =
            hunter.y + m.dy;


        if(!isWall(nx,ny)) {

            hunter.x = nx;

            hunter.y = ny;

            updatePosition(hunter);

            break;

        }

    }


    if(
        hunter.x === player.x &&
        hunter.y === player.y
    ) {

        loseLife();

    }


    updateHunterStatus();

}


// ==================================================
// ARMADILHAS
// ==================================================

function checkTraps() {

    for(const trap of traps) {

        if(
            trap.x === player.x &&
            trap.y === player.y
        ) {

            loseLife();

            if(playing) {

                document.getElementById(
                    "message"
                ).textContent =
                    "💀 Você caiu em uma armadilha!";

            }

        }

    }

}


// ==================================================
// CHAVES
// ==================================================

function checkKeys() {

    for(let i = keys.length - 1; i >= 0; i--) {

        const k = keys[i];


        if(
            player.x === k.x &&
            player.y === k.y
        ) {

            k.element.remove();

            keys.splice(i,1);

            keysCollected++;


            document.getElementById(
                "keyStatus"
            ).textContent =
                keysCollected +
                "/" +
                levels[currentLevel].keys;


            document.getElementById(
                "message"
            ).textContent =
                "🔑 Você encontrou uma chave!";

        }

    }

}


// ==================================================
// PORTA
// ==================================================

function checkDoor() {

    if(
        player.x === door.x &&
        player.y === door.y
    ) {

        if(
            keysCollected ===
            levels[currentLevel].keys
        ) {

            winLevel();

        }
        else {

            document.getElementById(
                "message"
            ).textContent =
                "🔒 Ainda faltam chaves!";

        }

    }

}


// ==================================================
// INTERAÇÕES
// ==================================================

function checkInteractions() {

    checkKeys();

    checkTraps();

    checkDoor();

}


// ==================================================
// PERDER VIDA
// ==================================================

function loseLife() {

    if(!playing) return;


    lives--;


    document.getElementById(
        "lives"
    ).textContent =
        lives;


    if(lives <= 0) {

        playing = false;

        clearIntervals();


        document.getElementById(
            "message"
        ).textContent =
            "💀 GAME OVER!";


        return;

    }


    document.getElementById(
        "message"
    ).textContent =
        "😱 Você foi encontrado!";


    player.x = 1;

    player.y = 1;


    updatePosition(player);

}


// ==================================================
// STATUS
// ==================================================

function updateHunterStatus() {

    const status =
        document.getElementById(
            "hunterStatus"
        );

    const danger =
        document.getElementById(
            "danger"
        );


    if(hunting) {

        status.textContent =
            "🚨 PERSEGUINDO!";

        status.style.color =
            "red";

        danger.style.display =
            "block";

    }
    else {

        status.textContent =
            "PROCURANDO";

        status.style.color =
            "white";

        danger.style.display =
            "none";

    }

}


// ==================================================
// LANTERNA
// ==================================================

function updateFlashlight() {

    const size =
        levels[currentLevel].flashlight;


    const px =
        player.x * 5 + 2.5;


    const py =
        player.y * 8.333 + 4.16;


    darkness.style.background =

        `radial-gradient(
            circle ${size}px at ${px}% ${py}%,
            transparent 0px,
            rgba(0,0,0,.12) ${size * .35}px,
            rgba(0,0,0,.65) ${size * .7}px,
            rgba(0,0,0,.92) ${size}px,
            #000 ${size * 1.5}px
        )`;

}


// ==================================================
// TIMER
// ==================================================

function startTimer() {

    clearInterval(timerInterval);


    const time =
        levels[currentLevel].time;


    if(time <= 0) {

        document.getElementById(
            "timer"
        ).textContent =
            "∞";

        return;

    }


    timerValue = time;


    document.getElementById(
        "timer"
    ).textContent =
        timerValue + "s";


    timerInterval =
        setInterval(function() {

            if(!playing) return;


            timerValue--;


            document.getElementById(
                "timer"
            ).textContent =
                timerValue + "s";


            if(timerValue <= 0) {

                playing = false;

                clearIntervals();


                document.getElementById(
                    "message"
                ).textContent =
                    "⏰ O TEMPO ACABOU!";

            }

        },1000);

}


// ==================================================
// LIMPAR INTERVALOS
// ==================================================

function clearIntervals() {

    clearInterval(
        hunterInterval
    );

    clearInterval(
        timerInterval
    );

}


// ==================================================
// VENCER FASE
// ==================================================

function winLevel() {

    playing = false;

    clearIntervals();


    /*
       Desbloqueia próxima fase.
    */

    const progress =
        getProgress();


    if(
        currentLevel + 2 >
        progress
    ) {

        setProgress(
            Math.min(
                5,
                currentLevel + 2
            )
        );

    }


    document.getElementById(
        "victoryText"
    ).textContent =

        currentLevel < 4

        ? "Você desbloqueou a próxima fase! 🔓"

        : "🏆 Você terminou todas as fases!";


    document.getElementById(
        "victory"
    ).style.display =
        "flex";

}


// ==================================================
// PRÓXIMA FASE
// ==================================================

function nextLevel() {

    document.getElementById(
        "victory"
    ).style.display =
        "none";


    if(currentLevel < 4) {

        startLevel(
            currentLevel + 1
        );

    }
    else {

        showMenu();

    }

}


// ==================================================
// REINICIAR FASE
// ==================================================

function restartLevel() {

    clearIntervals();


    document.getElementById(
        "victory"
    ).style.display =
        "none";


    playing = true;

    hunting = false;

    lives = 3;

    keysCollected = 0;


    const settings =
        levels[currentLevel];


    document.getElementById(
        "levelTitle"
    ).textContent =
        "FASE " +
        (currentLevel + 1) +
        " — " +
        settings.name;


    document.getElementById(
        "lives"
    ).textContent =
        "3";


    document.getElementById(
        "keyStatus"
    ).textContent =
        "0/" +
        settings.keys;


    document.getElementById(
        "message"
    ).textContent =
        "Encontre " +
        settings.keys +
        (settings.keys === 1
            ? " chave"
            : " chaves") +
        " e escape!";


    document
        .querySelectorAll(
            "#player,#key,#door,.monster"
        )
        .forEach(
            e => e.remove()
        );


    createMap();


    // Jogador

    player =
        createObject(
            "player",
            "👧",
            1,
            1
        );


    // Porta

    door =
        createObject(
            "door",
            "🚪",
            18,
            1
        );


    // Chaves

    keys = [];


    const keyPositions = [

        [17,10],

        [12,7]

    ];


    for(
        let i = 0;
        i < settings.keys;
        i++
    ) {

        const position =
            keyPositions[i];


        const newKey =
            createObject(
                "key" + i,
                "🔑",
                position[0],
                position[1]
            );


        keys.push(newKey);

    }


    // Perseguidor

    hunter =
        createObject(
            "hunter",
            "👹",
            10,
            5,
            "monster hunter"
        );


    // Armadilhas

    traps = [];


    const trapPositions = [

        [7,9],

        [14,10],

        [5,5],

        [16,7],

        [11,10],

        [3,9]

    ];


    for(
        let i = 0;
        i < settings.traps;
        i++
    ) {

        const position =
            trapPositions[i];


        const trap =
            createObject(
                "trap" + i,
                i % 2 === 0
                    ? "👺"
                    : "👿",
                position[0],
                position[1],
                "monster trap"
            );


        traps.push(trap);

    }


    updateFlashlight();

    updateHunterStatus();


    /*
       Começa o perseguidor.
    */

    hunterInterval =
        setInterval(
            moveHunter,
            settings.hunterSpeed
        );


    startTimer();

}


// ==================================================
// APAGAR PROGRESSO
// ==================================================

function resetProgress() {

    const confirmReset =
        confirm(
            "Tem certeza que deseja apagar todas as fases desbloqueadas?"
        );


    if(confirmReset) {

        localStorage.removeItem(
            "labyrinthProgress"
        );

        createLevelMenu();

    }

}


// ==================================================
// COMEÇAR
// ==================================================

createLevelMenu();

</script>
